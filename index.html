<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let view = 'all';

document.getElementById('meta').textContent = 'Generated ' + DATA.generated + ' · tap a property to expand · refer to one by its # number';
const s = DATA.stats;
document.getElementById('stats').innerHTML =
  `<span><b>${s.active}</b> active</span><span><b>${s.new}</b> new</span>` +
  `<span><b>${s.rejected}</b> eliminated</span>` +
  `<span><b>${s.total}</b> evaluated to date</span>`;
document.getElementById('wbar').textContent = 'Weights — ' +
  Object.entries(DATA.weights).map(([k,v]) => `${DATA.score_labels[k]||k} ${Math.round(v*100)}%`).join(' · ');

const vc = document.getElementById('views');
DATA.views.forEach(([id,label]) => {
  const b = document.createElement('button');
  b.textContent = label; b.dataset.v = id;
  if (id === view) b.className = 'active';
  b.onclick = () => { view = id; render(); };
  vc.appendChild(b);
});

function esc(x){ return (x==null?'':String(x)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(x){ return x==null ? '—' : '$' + Number(x).toLocaleString(); }
function zillowUrl(d){
  if (d.zpid) return 'https://www.zillow.com/homedetails/' + d.zpid + '_zpid/';
  if (!d.address) return null;
  const slug = d.address.trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');
  return 'https://www.zillow.com/homes/' + slug + '_rb/';
}

function scoreCell(d){
  if (d.overall_score == null) return `<div class="score"><div class="n">&mdash;</div><small>unscored</small></div>`;
  const inc = d.score_incomplete ? '*' : '';
  const n = Math.round(d.overall_score);
  return `<div class="score"><div class="n">${n}${inc}</div><small>/ 100</small>`
    + `<div class="meter"><i style="width:${n}%"></i></div></div>`;
}

function badges(d){
  const out = [];
  if (d.is_rejected && !d.reconsider_flag) out.push(`<span class="b rej">ELIMINATED</span>`);
  if (d.reconsider_flag) out.push(`<span class="b reconsider">RECONSIDER</span>`);
  if (d.hard_filter_pass === 0) out.push(`<span class="b fail">HARD-FILTER FAIL</span>`);
  if (d.hard_filter_pass === null) out.push(`<span class="b needsdata">filter: needs data</span>`);
  if (d.status === 'inactive') out.push(`<span class="b">delisted</span>`);
  ['studio','yard','location','condition','lot','parking','extras'].forEach(k=>{
    const v = d['score_'+k];
    if (v != null) out.push(`<span class="b score-b">${k[0].toUpperCase()+k.slice(1)} ${Math.round(v)}</span>`);
  });
  return `<div class="badges">${out.join('')}</div>`;
}

function assessTable(a){
  const keys = Object.keys(a); if (!keys.length) return '';
  return `<table class="assess">` + keys.map(k=>{
    const v = a[k];
    return `<tr><td>${esc(k)}</td><td>${esc(v.value)}<span class="cf ${esc(v.confidence)}">${esc(v.confidence)}</span>`
      + (v.evidence ? `<div class="sub">${esc(v.evidence)}</div>` : '') + `</td></tr>`;
  }).join('') + `</table>`;
}

function list(arr, cls){
  if (!arr || !arr.length) return '';
  return `<ul class="${cls||''}">` + arr.map(x=>`<li>${esc(x)}</li>`).join('') + `</ul>`;
}

function detail(d){
  const h = d.history.map(x=>`<tr><td>${esc((x.ts||'').slice(0,10))}</td><td>${esc(x.type)}</td>`
    + `<td>${esc(x.detail || [x.old_value,x.new_value].filter(Boolean).join(' → '))}</td></tr>`).join('');
  return `<div class="detail" id="d${d.id}">
    ${d.photo_url?`<a href="${esc(d.photo_url)}" target="_blank" rel="noopener"><img class="detail-photo" alt="listing photo" loading="lazy" src="${esc(d.photo_url)}" onerror="this.style.display='none'"></a>`:''}
    <h4>AI verdict</h4><div>${esc(d.ai_verdict) || '—'}</div>
    ${d.reconsider_reason ? `<h4>Why resurfaced</h4><div>${esc(d.reconsider_reason)}</div>`:''}
    ${d.is_rejected ? `<h4>Rejection</h4><div>${esc(d.rejection_reason)||'—'} <span class="sub">${esc((d.rejection_date||'').slice(0,10))}</span></div>`:''}
    ${d.top_positives.length?`<h4>Top positives</h4>${list(d.top_positives,'pos')}`:''}
    ${d.top_concerns.length?`<h4>Top concerns</h4>${list(d.top_concerns,'con')}`:''}
    ${d.hard_filter_fails.length?`<h4>Hard-filter notes</h4>${list(d.hard_filter_fails)}`:''}
    ${d.verification_needed.length?`<h4>Verification needed</h4>${list(d.verification_needed)}`:''}
    ${d.studio_photo_url?`<h4>Studio space</h4><a href="${esc(d.studio_photo_url)}" target="_blank" rel="noopener"><img class="detail-photo" alt="studio space" loading="lazy" src="${esc(d.studio_photo_url)}" onerror="this.style.display='none'"></a>`:''}
    <h4>Assessments</h4>${assessTable(d.assessments) || '<div class="sub">none recorded</div>'}
    <h4>Facts</h4>
    <div class="sub">${[
        d.beds!=null?d.beds+' bd':'', d.baths!=null?d.baths+' ba':'',
        d.house_sqft?d.house_sqft.toLocaleString()+' sqft house':'',
        d.lot_sqft?d.lot_sqft.toLocaleString()+' sqft lot':'',
        d.year_built?'built '+d.year_built:'', d.stories?d.stories+' story':'',
        d.ac===1?'A/C':(d.ac===0?'no A/C':''), d.parking?d.parking+' parking':''
      ].filter(Boolean).join(' · ')}</div>
    ${d.notes?`<h4>My notes</h4><div>${esc(d.notes).replace(/\n/g,'<br>')}</div>`:''}
    ${h?`<h4>History</h4><table class="assess">${h}</table>`:''}
    ${(()=>{ const z=zillowUrl(d); return z?`<div style="margin-top:10px"><a href="${esc(z)}" target="_blank" rel="noopener">View on Zillow ↗</a></div>`:''; })()}
  </div>`;
}

function thumb(d){
  if (d.photo_url) return `<div class="thumb"><img alt="" loading="lazy" src="${esc(d.photo_url)}"
    onerror="this.parentElement.classList.add('ph');this.parentElement.textContent='no photo'"></div>`;
  return `<div class="thumb ph">no photo<br>yet</div>`;
}

function card(d){
  const key = d.top_concerns[0] || (d.hard_filter_fails[0]) || '';
  return `<div class="card">
    <div class="row" onclick="toggle(${d.id})">
      ${thumb(d)}
      ${scoreCell(d)}
      <div>
        <div class="addr"><span class="idnum">#${d.id}</span> ${esc(d.address)}</div>
        <div class="sub">${esc(d.neighborhood||'')}${d.zip?' · '+esc(d.zip):''} · ${esc(d.status)}${d.ai_verdict?' · '+esc(d.ai_verdict.split(/[.—]/)[0]):''}</div>
        ${badges(d)}
        ${key?`<div class="mini">&#9888; ${esc(key)}</div>`:''}
      </div>
      <div class="price">${money(d.price)}
        ${d.price_first && d.price && d.price_first!==d.price ? `<span class="pchip">was ${money(d.price_first)}</span>`:''}
      </div>
    </div>
    ${detail(d)}
  </div>`;
}

function toggle(id){ document.getElementById('d'+id).classList.toggle('open'); }

function render(){
  document.querySelectorAll('.views button').forEach(b=>b.classList.toggle('active', b.dataset.v===view));
  const arr = DATA.properties.filter(d => d.views.includes(view));
  const el = document.getElementById('list');
  el.innerHTML = arr.length ? arr.map(card).join('') : `<div class="empty">Nothing in this view.</div>`;
}

// print / PDF: expand every card so nothing is hidden on paper
function expandAll(){ document.querySelectorAll('.detail').forEach(e=>e.classList.add('open')); }
window.addEventListener('beforeprint', expandAll);

const printMode = new URLSearchParams(location.search).has('print');
if (printMode) view = 'all';
render();
if (printMode) expandAll();
</script>
</body>
</html>
